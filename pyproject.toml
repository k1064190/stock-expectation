[project]
name = "stock-expectation"
version = "0.1.0"
description = "Stock prediction system with track record for US and Korean markets"
requires-python = ">=3.11"
dependencies = [
    "pykrx>=1.2",
    "finance-datareader>=0.9",
    "yfinance>=1.2",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
]
api = [
    # Only needed for scheduler's --mode api (Anthropic API direct calls)
    "anthropic>=0.80",
]
skills = [
    # Only needed for running imported skill scripts directly
    "jsonschema",
    "scipy>=1.11,<2",
]
memory = [
    # Stage 7-A: mem0 + Qdrant + sentence-transformers for the memory layer
    "mem0ai>=0.1",
    "qdrant-client>=1.9",
    "sentence-transformers>=2.5",
]
graph = [
    # Stage 7-B: Neo4j Community Edition driver
    "neo4j>=5.20",
]

[project.scripts]
stock-cli = "stock_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests", "mcp-market-data/tests", "mcp-prediction-store/tests", "scheduler/tests", "portfolio/tests", "paper_trading/tests"]
asyncio_mode = "auto"
markers = [
    "network: tests that require network access (deselect with '-m not network')",
]

[tool.setuptools]
py-modules = ["stock_cli"]
packages = ["portfolio"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
