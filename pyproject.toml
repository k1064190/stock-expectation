[project]
name = "stock-expectation"
version = "0.1.0"
description = "Stock prediction system with track record for US and Korean markets"
requires-python = ">=3.11"
dependencies = [
    "pykrx>=1.2",
    "finance-datareader>=0.9",
    "yfinance>=1.2",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
]
api = [
    # Only needed for scheduler's --mode api (Anthropic API direct calls)
    "anthropic>=0.80",
]

[project.scripts]
stock-cli = "stock_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests", "mcp-market-data/tests", "mcp-prediction-store/tests", "scheduler/tests"]
asyncio_mode = "auto"
markers = [
    "network: tests that require network access (deselect with '-m not network')",
]

[tool.setuptools]
py-modules = ["stock_cli"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
